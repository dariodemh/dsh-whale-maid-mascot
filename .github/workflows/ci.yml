name: host-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: Host route tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run host route tests
        run: node test/host-routes.test.mjs
